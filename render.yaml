# Render Blueprint — 言葉 LINGUA 后端一键部署
# 文档：https://render.com/docs/blueprint-spec
# 使用：在 Render Dashboard 导入此仓库即可自动创建以下服务

services:
  - type: web
    name: lingua-platform-api
    runtime: node
    plan: free
    region: singapore  # 新加坡，国内访问相对友好；可选 oregon / frankfurt
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: JWT_SECRET
        generateValue: true  # Render 自动生成随机密钥
      - key: DATABASE_URL
        fromDatabase:
          name: lingua-db
          property: connectionString

databases:
  - name: lingua-db
    plan: free
    region: singapore
